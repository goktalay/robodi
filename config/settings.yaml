robodi:
  name: "ROBODİ"
  version: "1.0.0"
  debug: false

# ─── Servolar (PCA9685, I2C: GPIO2 SDA / GPIO3 SCL) ──────────────
# Hepsi MG996R 180°. Açı: yazılımın kullandığı açı (min..max).
# Fiziksel açı = açı + offset (0..180). min_pulse/max_pulse (µs): şimdilik her servoda güvenli
# 1000-2000 µs (yaklaşık 90° hareket); MG996R için donanımda genişletilecek (~500-2500).
# servo ters dönüyorsa invert: true.
servos:
  i2c_address: 0x40
  frequency: 50
  waist_handoff: 60          # kafa yatay bu açıyı geçince gövde kişiye döner (derece)
  channels:
    head_pan:  {channel: 0, min: -90, max: 90,  center: 0,  offset: 90, min_pulse: 1000, max_pulse: 2000, invert: false}  # kafa yatay (pan-tilt)
    head_tilt: {channel: 1, min: -30, max: 30,  center: 0,  offset: 90, min_pulse: 1000, max_pulse: 2000, invert: false}  # kafa dikey (pan-tilt)
    left_arm:  {channel: 2, min: 0,   max: 180, center: 90, offset: 0,  min_pulse: 1000, max_pulse: 2000, invert: false}  # sol kol
    right_arm: {channel: 3, min: 0,   max: 180, center: 90, offset: 0,  min_pulse: 1000, max_pulse: 2000, invert: false}  # sağ kol
    waist:     {channel: 4, min: -90, max: 90,  center: 0,  offset: 90, min_pulse: 1000, max_pulse: 2000, invert: false}  # gövde dönüşü (tabanda)

# ─── Audio (ReSpeaker 2-Mics) ────────────────────────────────────
audio:
  input_device: "seeed2micvoicec"   # ReSpeaker 2-Mics v2.0 ALSA kart adı (cihaz adında aranır)
  sample_rate: 16000
  channels: 2
  chunk_size: 1024
  vad_threshold: 0.5
  wake_word_model: "hey_jarvis"   # openWakeWord modeli ("hey robodi" özel modeli eğitilene kadar)
  wake_word_threshold: 0.5
  vosk_model: "models/vosk-model-small-tr"
  tts_engine: "pyttsx3"        # veya "edge-tts"
  language: "tr-TR"
  # Ses seviyesi: PAM8403 amfide düğme yok, seviye ReSpeaker v2.0 (TLV320AIC3104) mikserinden ayarlanır
  mixer_card: "seeed2micvoicec"
  mixer_controls: ["PCM"]      # DAC dijital seviyesi (0-127); HP/Line çıkış kazancı alsactl durumunda
  volume: 80                   # yüzde

# ─── Vision (AI Camera IMX500) ───────────────────────────────────
vision:
  camera_index: 0
  resolution: [1920, 1080]
  fps: 30
  ai_model: "imx500_mobilenet_ssd"
  detection_confidence: 0.6
  face_tracking: true
  face_id_interval: 2.0          # kimlik tanıma aralığı (sn)
  face_id:
    encodings_file: "data/face_encodings.pkl"
    users_file: "data/authorized_users.json"
    tolerance: 0.5

# ─── ESP32 ekran kartları (USB) ──────────────────────────────────
# eyes: Waveshare ESP32-S3 çift göz · mouth: ESP32-C3 1.47" · chest: ESP32-S3 1.69" dokunmatik
# "auto": USB portları taranır, her kart WHO komutuna adıyla cevap verir.
# Sabit port da yazılabilir, ör. "/dev/ttyACM0".
esp32:
  baud_rate: 115200
  boards:
    eyes:  "auto"
    mouth: "auto"
    chest: "auto"

# ─── Web Arayüzü ─────────────────────────────────────────────────
web:
  host: "0.0.0.0"
  port: 8080
  debug: false
  secret_key: "robodi-secret-2024"   # sadece yedek; esas anahtar ROBODI_SECRET_KEY ortam değişkeni

# ─── LLM / AI ────────────────────────────────────────────────────
ai:
  provider: "claude"         # claude (online, Ollama yedekli) veya ollama (sadece yerel)
  max_tokens: 1024
  history_size: 10           # hatırlanan soru-cevap sayısı
  claude:
    model: "claude-opus-5-5" # ANTHROPIC_API_KEY ortam değişkeni gerekir
    effort: "low"            # sohbet için düşük gecikme
  ollama:
    url: "http://localhost:11434"
    model: "llama3.2:3b"
    temperature: 0.7
  system_prompt: |
    Sen ROBODİ, Muhammed'in masa arkadaşı olan akıllı bir robotsun.
    Türkçe konuşuyorsun. Samimi, eğlenceli ve yardımseversin.
    Zaman zaman şaka yapıyorsun. Kısa ve öz cevaplar veriyorsun; yanıtların sesli okunacak.

# ─── Sohbet ──────────────────────────────────────────────────────
conversation:
  max_turns: 5               # bir wake word sonrası en fazla soru-cevap

# ─── Zamanlanmış görevler ────────────────────────────────────────
schedule:
  morning_summary_hour: 9
  joke_interval_min: 60      # dakika; 0 = şakalar kapalı
  joke_interval_max: 120

# ─── Gmail (sabah özeti) ─────────────────────────────────────────
gmail:
  enabled: true
  credentials_file: "data/gmail_credentials.json"
  token_file: "data/gmail_token.json"
