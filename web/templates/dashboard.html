{% extends "base.html" %}
{% block title %}Dashboard{% endblock %}
{% block header %}Dashboard{% endblock %}

{% block content %}
<div class="grid grid-4">
  <div class="card stat-card">
    <div class="stat-icon">🤖</div>
    <div class="stat-label">Durum</div>
    <div class="stat-value" id="statStatus">—</div>
  </div>
  <div class="card stat-card">
    <div class="stat-icon">👤</div>
    <div class="stat-label">Aktif Kullanıcı</div>
    <div class="stat-value" id="statUser">—</div>
  </div>
  <div class="card stat-card">
    <div class="stat-icon">🎙️</div>
    <div class="stat-label">Konuşma</div>
    <div class="stat-value" id="statConversation">Pasif</div>
  </div>
  <div class="card stat-card">
    <div class="stat-icon">📧</div>
    <div class="stat-label">Mail</div>
    <div class="stat-value" id="statMail">—</div>
  </div>
</div>

<div class="grid grid-2">
  <!-- Hızlı Kontrol -->
  <div class="card">
    <h2 class="card-title">⚡ Hızlı Kontrol</h2>
    <div class="control-group">
      <label>Manuel Mesaj</label>
      <div class="input-row">
        <input type="text" id="speakText" class="input" placeholder="ROBODİ'ye söyletmek istediğin şey...">
        <button class="btn btn-primary" onclick="speakText()">Söyle</button>
      </div>
    </div>
    <div class="button-grid">
      <button class="btn btn-secondary" onclick="tellJoke()">🎭 Şaka Yap</button>
      <button class="btn btn-secondary" onclick="morningSummary()">☀️ Sabah Özeti</button>
      <button class="btn btn-danger" onclick="stopSpeaking()">🔇 Durdur</button>
      <button class="btn btn-secondary" onclick="refreshStatus()">🔄 Yenile</button>
    </div>
  </div>

  <!-- ESP32 Animasyonlar -->
  <div class="card">
    <h2 class="card-title">👁️ Animasyon Kontrolü</h2>
    <div class="anim-grid">
      <button class="btn btn-anim" onclick="sendAnim('eyes_idle')">😐 Normal</button>
      <button class="btn btn-anim" onclick="sendAnim('eyes_happy')">😊 Mutlu</button>
      <button class="btn btn-anim" onclick="sendAnim('eyes_thinking')">🤔 Düşünüyor</button>
      <button class="btn btn-anim" onclick="sendAnim('eyes_surprised')">😮 Şaşırmış</button>
      <button class="btn btn-anim" onclick="sendAnim('eyes_sleepy')">😴 Uykulu</button>
      <button class="btn btn-anim" onclick="sendAnim('eyes_angry')">😠 Kızgın</button>
    </div>
  </div>
</div>

<!-- Canlı Log -->
<div class="card">
  <h2 class="card-title">📋 Canlı Log <span class="badge badge-live">CANLI</span></h2>
  <div class="log-container" id="logContainer"></div>
</div>
{% endblock %}

{% block scripts %}
<script>
async function speakText() {
  const text = document.getElementById('speakText').value.trim();
  if (!text) return;
  const r = await fetch('/api/speak', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({text})
  });
  const d = await r.json();
  showToast(d.success ? '✅ Söyleniyor...' : '❌ ' + d.error);
  document.getElementById('speakText').value = '';
}

async function tellJoke() {
  const r = await fetch('/api/tell-joke', {method: 'POST'});
  const d = await r.json();
  showToast(d.success ? '🎭 Şaka geliyor...' : '❌ ' + d.error);
}

async function morningSummary() {
  const r = await fetch('/api/morning-summary', {method: 'POST'});
  const d = await r.json();
  showToast(d.success ? '☀️ Özet hazırlanıyor...' : '❌ ' + d.error);
}

function stopSpeaking() {
  showToast('🔇 Durduruldu');
}

function sendAnim(anim) {
  fetch('/api/animation', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({animation: anim})
  });
}

async function refreshStatus() {
  const r = await fetch('/api/status');
  const d = await r.json();
  document.getElementById('statStatus').textContent = d.running ? '🟢 Çalışıyor' : '🔴 Durdu';
  document.getElementById('statUser').textContent = d.current_user || 'Yok';
  document.getElementById('statConversation').textContent = d.is_active ? '🎙️ Konuşuyor' : 'Pasif';
}

// Canlı log
const socket = io();
const logContainer = document.getElementById('logContainer');

socket.on('log', (data) => {
  const line = document.createElement('div');
  line.className = 'log-line';
  if (data.line.includes('ERROR')) line.classList.add('log-error');
  else if (data.line.includes('WARNING')) line.classList.add('log-warn');
  else if (data.line.includes('ROBODİ:')) line.classList.add('log-robot');
  line.textContent = data.line;
  logContainer.appendChild(line);
  logContainer.scrollTop = logContainer.scrollHeight;
  // Max 200 satır tut
  while (logContainer.children.length > 200) {
    logContainer.removeChild(logContainer.firstChild);
  }
});

// SSE fallback
const evtSource = new EventSource('/api/logs/stream');
evtSource.onmessage = (e) => {
  const data = JSON.parse(e.data);
  const line = document.createElement('div');
  line.className = 'log-line';
  if (data.line.includes('ERROR')) line.classList.add('log-error');
  else if (data.line.includes('WARNING')) line.classList.add('log-warn');
  line.textContent = data.line;
  logContainer.appendChild(line);
  logContainer.scrollTop = logContainer.scrollHeight;
};

refreshStatus();
setInterval(refreshStatus, 5000);

document.getElementById('speakText').addEventListener('keypress', (e) => {
  if (e.key === 'Enter') speakText();
});
</script>
{% endblock %}
