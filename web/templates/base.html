<!DOCTYPE html>
<html lang="tr" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}ROBODİ{% endblock %} — Dashboard</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🤖</text></svg>">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.min.js"></script>
</head>
<body>
  <aside class="sidebar">
    <div class="sidebar-logo">
      <span class="logo-icon">🤖</span>
      <span class="logo-text">ROBODİ</span>
    </div>
    <nav class="sidebar-nav">
      <a href="/" class="nav-item {% if request.path == '/' %}active{% endif %}">
        <span class="nav-icon">📊</span> Dashboard
      </a>
      <a href="/users" class="nav-item {% if request.path == '/users' %}active{% endif %}">
        <span class="nav-icon">👥</span> Kullanıcılar
      </a>
      <a href="/logs" class="nav-item {% if request.path == '/logs' %}active{% endif %}">
        <span class="nav-icon">📋</span> Loglar
      </a>
      <a href="/settings" class="nav-item {% if request.path == '/settings' %}active{% endif %}">
        <span class="nav-icon">⚙️</span> Ayarlar
      </a>
    </nav>
    <div class="sidebar-footer">
      <div class="status-indicator" id="robotStatus">
        <span class="status-dot offline"></span>
        <span class="status-text">Bağlanıyor...</span>
      </div>
      <a href="/logout" class="nav-item logout">
        <span class="nav-icon">🚪</span> Çıkış
      </a>
    </div>
  </aside>

  <main class="main-content">
    <header class="page-header">
      <h1>{% block header %}{% endblock %}</h1>
      <div class="header-right">
        <span id="currentUser" class="current-user"></span>
        <span class="datetime" id="datetime"></span>
      </div>
    </header>
    <div class="content">
      {% block content %}{% endblock %}
    </div>
  </main>

  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
